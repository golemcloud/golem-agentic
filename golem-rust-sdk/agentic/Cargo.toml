[package]
description = "Core of agentic SDK helps write golem components with zero knowledge on webassembly"
edition = "2021"
homepage = "https://golem.cloud"
license = "Apache-2.0"
name = "golem-agentic"
version = "0.0.0"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
golem-agentic-macros = { path = "../agentic-macros", version = "0.0.0", default-features = false }
ctor = "0.4.2"

# same dependency as in golem-rust to avoid conflicts when moving to golemr epo
golem-wasm-rpc = {version = "1.3.0-rc9pre", default-features = false, features = [
  "stub", "typeinfo"
]}

golem-wasm-ast = {version = "1.3.0-rc9pre", default-features = false, features = [
  "analysis", "json"
  ]}

log = {workspace = true}
mime = "0.3.17"
nom = {version = "7.1", default-features = false}
once_cell = "1.21.3"
reqwest = {workspace = true}
serde_json = "1.0.140"
thiserror = "2.0.12"
wasi-logger = "0.1.2"
wit-bindgen = {version = "0.40.0"}
